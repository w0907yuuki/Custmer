<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

</head>
<body>
	<div th:insert="~{common/sourceList :: sourceList}"></div>
   	<div th:replace="~{common/messageIcon :: messageIcon}"></div>
   	<script type="text/javascript" th:src="@{/js/receptionmanagement.js}"></script>
   	<div class="container-fluid">
    	<div class="alert d-flex align-items-center mt-3" th:classappend="|${isError ? 'alert-danger' : 'alert-primary'}|" role="alert" th:if="${message != null}">
			<svg class="bi flex-shrink-0 me-2" width="24" height="24">
	        	<use xlink:href="#exclamation-triangle-fill" th:if="${isError}" />
	            <use xlink:href="#info-fill" th:unless="${isError}"/>
	        </svg>
	        <span th:text="${message}"></span>
     	</div>
		<h2 class="mt-3">予約管理</h2>
   		<div class="mt-3">
			<span>＜絞り込み＞</span>
		</div>
		<form th:action="@{/receptionmanagement}" method="post" th:object="${receptionForm}">
			<div class="mt-1">
				<table>
					<tr>
						<td><span>テーブル番号</span></td>
						<td>
							<div class="row g-3 align-items-center">
								<div class="col-auto">
									<input type="text" class="form-control">
								</div>
							</div>
						</td>
					</tr>
				</table>
				<input type="submit" class="btn btn-primary mt-3" name="search" value="検索">
			</div>
			<div class="mt-3">
			    <th:block th:unless="${#lists.isEmpty(receptionList)}">
			        <table class="table table-striped" id="receptionList">
			            <thead>
			            <tr>
							<th scope="col">ID</th>
			                <th scope="col">予約名</th>
			                <th scope="col">予約人数</th>
			                <th scope="col">予約コース</th>
							<th scope="col">予約時間</th>
							<th scope="col">予約状態</th>
			            </tr>
			            </thead>
			            <tbody>
			                <tr th:each="reception, stat  : ${receptionList}" >  
								<td th:id="|id_${stat.count}|"><span th:text="${reception.receptionid}"></span></td>
			                    <td th:id="|name_${stat.count}|"><span th:text="${reception.name}"></span></td>
			                    <td th:id="|count_${stat.count}|"><span th:text="${reception.count}"></span></td>
			                    <td th:id="|course_${stat.count}|"><span th:text="${reception.course}"></span></td>
								<td th:id="|time_${stat.count}|"><span th:text="${reception.time}"></span></td>
								<td th:id="|state_${stat.count}|"><span th:text="${reception.state}"></span></td>
							</tr>
			            </tbody>
			        </table>
			        <input type="text" th:field="*{selectedreceptionid}" hidden>
			        <button type="submit" class="btn btn-primary" name="regist">
			            <i class="bi bi-plus-lg"></i>登録
			        </button> 
			        <button type="submit" class="btn btn-secondary" id="editBtn" name="edit" disabled>
			            <i class="bi bi-pencil"></i>編集
			        </button>   
			        <button type="button" class="btn btn-danger" id="deleteDummyBtn" data-bs-toggle="modal" data-bs-target="#deleteConfirm" disabled>
			            <i class="bi bi-trash"></i>削除
			        </button>   
			        <input type="submit" id="deleteBtn" name="delete" hidden>
			    </th:block>
			    <th:block th:if="${#lists.isEmpty(receptionList)}">
			        <div class="text-center">
			            <span>※対象のユーザーは存在しません。</span>
			        </div>
			    </th:block>
			    <div class="mt-3">
			        <a th:href="@{/topmenu}">▶トップメニューへ戻る</a>
			    </div>
			</div>			
		</form>
   	</div>
	<!-- 削除確認モーダルの設定 -->
    <div class="modal fade" id="deleteConfirm" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">削除前確認</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    本当に削除してもよろしいですか？
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="deleteOkBtn">削除する</button>
                </div>
            </div>
        </div>
    </div>
	
</body>
</html>
